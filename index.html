<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahzad Shopping Centre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000;
            color: #fff;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #fff;
        }

        .brand-title {
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .nav-categories {
            display: flex;
            gap: 15px;
        }

        .cat-link {
            background: none;
            border: none;
            color: #aaa;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 8px;
            transition: 0.3s;
        }

        .cat-link.active, .cat-link:hover {
            color: #fff;
            border-bottom: 2px solid #fff;
        }

        /* Sidebar Drawer */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #111;
            color: #fff;
            z-index: 1000;
            transition: 0.3s ease-in-out;
            padding: 20px;
        }

        .sidebar.active {
            left: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            float: right;
            cursor: pointer;
        }

        .sidebar-header {
            margin-top: 40px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .sidebar-links {
            list-style: none;
        }

        .sidebar-links li {
            margin-bottom: 20px;
        }

        .sidebar-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .sidebar-links a:hover {
            color: #fff;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Hero Banner Section */
        .hero-container {
            width: 100%;
            height: 85vh;
        }

        .hero-banner {
            width: 100%;
            height: 100%;
            background: url('515CEA19-00DF-4588-B9D6-404304FA7351.jpeg') no-repeat center center/contain;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 60px;
            text-align: center;
            position: relative;
        }

        .banner-content h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 5px;
        }

        .banner-content p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .explore-btn {
            display: inline-block;
            padding: 12px 35px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .explore-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu Drawer -->
    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <div class="sidebar-header">
            <h3>SHAHZAD SHOPPING CENTRE</h3>
        </div>
        <ul class="sidebar-links">
            <li><a href="#" onclick="toggleSidebar()">Home</a></li>
            <li><a href="#categories" onclick="toggleSidebar()">Categories</a></li>
            <li><a href="#featured" onclick="toggleSidebar()">Featured Collection</a></li>
            <li><a href="#about" onclick="toggleSidebar()">About Us</a></li>
            <li><a href="#contact" onclick="toggleSidebar()">Contact Us</a></li>
        </ul>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="nav-left">
            <button class="menu-btn" aria-label="Menu" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1 class="brand-title">SHAHZAD SHOPPING CENTRE</h1>
        </div>

        <nav class="nav-categories">
            <button class="cat-link active" onclick="switchCategory('men')">MEN</button>
            <button class="cat-link" onclick="switchCategory('women')">WOMEN</button>
            <button class="cat-link" onclick="switchCategory('boy')">BOY</button>
            <button class="cat-link" onclick="switchCategory('girl')">GIRL</button>
            <button class="cat-link" onclick="switchCategory('newborn')">NEW BORN</button>
        </nav>
    </header>

    <!-- Main Hero Banner Section -->
    <main class="hero-container">
        <div class="hero-banner">
            <div class="banner-content">
                <h2>SHAHZAD SHOPPING CENTER</h2>
                <p>Your Trusted Destination for Quality</p>
                <a href="#categories" class="explore-btn">EXPLORE NOW</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
